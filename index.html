<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI GPS — le GPS des intelligences artificielles</title>
<meta name="description" content="Transforme un objectif en parcours d'IA : quelle IA, pour quoi faire, dans quel ordre, et comment passer le relais." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
/* =========================================================================
   AI GPS — DESIGN SYSTEM
   Palette : blanc chaud / encre / or antique. Pas de violet, pas de gadget.
   L'accent (or) est structurel : la "route", l'étape active, les CTA clés.
   ========================================================================= */
:root{
  --paper:#FCFCFA;        /* fond principal, blanc à peine chaud */
  --surface:#FFFFFF;      /* cartes */
  --surface-2:#F6F4EE;    /* surfaces secondaires */
  --ink:#17150F;          /* texte principal (charbon chaud, choix assumé) */
  --ink-soft:#4A4638;     /* texte secondaire */
  --ink-faint:#8A8676;    /* texte tertiaire */
  --line:#E7E2D4;         /* filets */
  --line-strong:#D8D2C0;
  --gold:#B08D3E;         /* or antique */
  --gold-deep:#8F6F2C;    /* or au survol */
  --gold-tint:#F3ECD9;    /* fond or très clair */
  --ok:#5C7A4A;
  --warn:#C08A2E;
  --danger:#A5442F;
  --info:#3D5A73;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(23,21,15,.04), 0 8px 24px rgba(23,21,15,.06);
  --shadow-lg:0 12px 40px rgba(23,21,15,.12);
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-display:'Space Grotesk','Inter',-apple-system,'Segoe UI',sans-serif;
  --maxw:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);color:var(--ink);background:var(--paper);
  line-height:1.55;-webkit-font-smoothing:antialiased;font-weight:400;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.12;letter-spacing:-.01em}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--gold-tint)}

/* ---------- Layout général ---------- */
.app{min-height:100vh;display:flex;flex-direction:column}
.container{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 24px}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(252,252,250,.86);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:22px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);
  font-weight:700;font-size:18px;letter-spacing:-.02em;cursor:pointer;flex-shrink:0}
.brand .mark{width:26px;height:26px;display:grid;place-items:center}
.brand .mark svg{width:26px;height:26px}
.nav{display:flex;gap:4px;margin-left:8px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:none;color:var(--ink-soft);font-size:14px;font-weight:500;
  padding:8px 12px;border-radius:8px;white-space:nowrap;transition:background .15s,color .15s}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.active{color:var(--ink);background:var(--gold-tint)}
.topbar-cta{flex-shrink:0}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:10px;
  font-size:14px;font-weight:500;transition:all .15s;line-height:1}
.btn:hover{border-color:var(--ink);background:var(--surface-2)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#000}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.gold:hover{background:var(--gold-deep);border-color:var(--gold-deep)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.block{width:100%;justify-content:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .ic{width:16px;height:16px;flex-shrink:0}

/* ---------- Badges & pastilles ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-soft);
  background:var(--surface)}
.badge.gold{background:var(--gold-tint);border-color:#E4D4A6;color:var(--gold-deep)}
.badge.free{background:#EEF4EA;border-color:#CFE0C4;color:#4C6A3B}
.badge.paid{background:#F6EEE9;border-color:#E4CDBE;color:#8A5433}
.badge.freemium{background:#EDF1F5;border-color:#CBD9E4;color:#3D5A73}
.badge.manual{background:var(--surface-2);border-color:var(--line-strong);color:var(--ink-soft)}
.badge.connected{background:#EEF4EA;border-color:#CFE0C4;color:#4C6A3B}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.todo{background:var(--line-strong)}
.dot.progress{background:var(--gold)}
.dot.wait{background:var(--warn)}
.dot.done{background:var(--ok)}
.dot.blocked{background:var(--danger)}

/* ---------- Cartes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.card.pad-lg{padding:28px}

/* ---------- HERO / Accueil ---------- */
.hero{padding:72px 0 40px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--gold-deep);
  font-weight:600;font-size:13px;margin-bottom:18px}
.eyebrow .line{width:26px;height:1px;background:var(--gold)}
.hero h1{font-size:52px;letter-spacing:-.025em;margin-bottom:16px}
.hero .sub{font-size:18px;color:var(--ink-soft);max-width:44ch;margin-bottom:28px}
.hero-input{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:14px;padding:8px 8px 8px 18px;box-shadow:var(--shadow);max-width:520px}
.hero-input input{flex:1;border:none;outline:none;font-size:16px;font-family:inherit;background:none;color:var(--ink)}
.hero-input input::placeholder{color:var(--ink-faint)}
.hero-hint{margin-top:14px;font-size:13.5px;color:var(--ink-faint)}
.hero-hint b{color:var(--ink-soft);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.hero-hint b:hover{text-decoration-color:var(--gold)}

/* Illustration "route" (le coeur visuel du produit) */
.route-viz{background:linear-gradient(180deg,#fff, #FBFAF4);border:1px solid var(--line);
  border-radius:20px;padding:30px 26px;box-shadow:var(--shadow)}
.route-viz .rv-title{font-size:12.5px;color:var(--ink-faint);font-weight:600;margin-bottom:22px}
.route-node{display:flex;align-items:center;gap:14px;position:relative;padding-bottom:20px}
.route-node:last-child{padding-bottom:0}
.route-node .rn-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line-strong);flex-shrink:0;font-weight:700;
  font-family:var(--font-display);color:var(--ink)}
.route-node.active .rn-ico{background:var(--ink);color:#fff;border-color:var(--ink)}
.route-node.goal .rn-ico{background:var(--gold);color:#fff;border-color:var(--gold)}
.route-node .rn-body .rn-k{font-size:12px;color:var(--ink-faint);font-weight:600}
.route-node .rn-body .rn-v{font-size:15px;font-weight:600;font-family:var(--font-display)}
.route-node::before{content:"";position:absolute;left:21px;top:44px;bottom:-1px;width:2px;
  background:repeating-linear-gradient(var(--gold) 0 5px,transparent 5px 10px);opacity:.55}
.route-node:last-child::before{display:none}

/* ---------- Modes d'entrée ---------- */
.section{padding:44px 0}
.section-head{margin-bottom:24px}
.section-head h2{font-size:26px;margin-bottom:6px}
.section-head p{color:var(--ink-soft);font-size:15px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;text-align:left;transition:border-color .15s,transform .15s,box-shadow .15s;cursor:pointer}
.mode:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--shadow)}
.mode .m-ico{width:38px;height:38px;border-radius:10px;background:var(--gold-tint);
  display:grid;place-items:center;margin-bottom:14px;color:var(--gold-deep)}
.mode h3{font-size:16px;margin-bottom:5px}
.mode p{font-size:13.5px;color:var(--ink-soft)}

/* ---------- Grille catégories ---------- */
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 10px;
  font-size:13px;font-weight:500;text-align:center;transition:all .15s;cursor:pointer;color:var(--ink-soft)}
.cat:hover{border-color:var(--gold);color:var(--ink);background:var(--gold-tint)}

/* ---------- Questionnaire ---------- */
.quiz-wrap{max-width:640px;margin:0 auto;padding:40px 0 60px}
.quiz-progress{height:4px;background:var(--line);border-radius:99px;margin-bottom:34px;overflow:hidden}
.quiz-progress .bar{height:100%;background:var(--gold);border-radius:99px;transition:width .4s ease}
.quiz-step-num{font-size:13px;color:var(--gold-deep);font-weight:600;margin-bottom:10px}
.quiz h2{font-size:28px;margin-bottom:8px}
.quiz .q-help{color:var(--ink-soft);font-size:15px;margin-bottom:26px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;border:1px solid var(--line-strong);background:var(--surface);
  border-radius:12px;padding:15px 18px;text-align:left;font-size:15.5px;font-weight:500;transition:all .15s;cursor:pointer}
.opt:hover{border-color:var(--gold);background:var(--gold-tint)}
.opt.selected{border-color:var(--ink);background:var(--ink);color:#fff}
.opt .o-check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-strong);flex-shrink:0;
  display:grid;place-items:center;transition:all .15s}
.opt.selected .o-check{background:#fff;border-color:#fff}
.opt.multi .o-check{border-radius:6px}
.opt .o-sub{font-size:12.5px;color:var(--ink-faint);font-weight:400;margin-top:2px}
.opt.selected .o-sub{color:rgba(255,255,255,.7)}
.quiz-nav{display:flex;justify-content:space-between;margin-top:30px;gap:12px}
.freeform textarea{width:100%;min-height:120px;border:1px solid var(--line-strong);border-radius:12px;
  padding:16px;font-family:inherit;font-size:15px;resize:vertical;color:var(--ink)}
.freeform textarea:focus{outline:none;border-color:var(--gold)}

/* ---------- Parcours recommandé ---------- */
.plan-wrap{max-width:760px;margin:0 auto;padding:36px 0 60px}
.plan-head{text-align:center;margin-bottom:32px}
.plan-head h2{font-size:30px;margin-bottom:8px}
.plan-head p{color:var(--ink-soft)}
.plan-step{display:flex;gap:18px;padding:20px 0;border-top:1px solid var(--line)}
.plan-step:first-of-type{border-top:none}
.plan-idx{width:40px;height:40px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line-strong);
  display:grid;place-items:center;font-family:var(--font-display);font-weight:700;flex-shrink:0}
.plan-body{flex:1;min-width:0}
.plan-body .ps-obj{font-size:16.5px;font-weight:600;font-family:var(--font-display);margin-bottom:3px}
.plan-body .ps-need{font-size:13px;color:var(--ink-faint);margin-bottom:12px}
.ai-pick{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px}
.ai-logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;
  font-family:var(--font-display);font-size:14px;color:#fff;flex-shrink:0}
.ai-pick .ap-name{font-weight:600;font-size:15px}
.ai-pick .ap-why{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
.ai-pick .ap-score{margin-left:auto;text-align:right;flex-shrink:0}
.ap-score .sc{font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--gold-deep)}
.ap-score .scl{font-size:10.5px;color:var(--ink-faint);font-weight:600}
.alts{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.alt-chip{font-size:12px;border:1px solid var(--line-strong);border-radius:99px;padding:5px 11px;
  background:var(--surface);color:var(--ink-soft);cursor:pointer;transition:all .15s}
.alt-chip:hover{border-color:var(--gold);color:var(--ink)}
.alt-chip .k{color:var(--ink-faint);font-weight:600}

/* ---------- Cockpit ---------- */
.cockpit{padding:26px 0 70px}
.cockpit-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.cockpit-top h2{font-size:24px}
.cockpit-top .ct-meta{font-size:13.5px;color:var(--ink-soft);margin-top:4px}
.route-track{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.track-step{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;
  cursor:pointer;transition:all .15s;position:relative}
.track-step:hover{border-color:var(--gold)}
.track-step.current{border-color:var(--ink);box-shadow:0 0 0 3px var(--gold-tint)}
.track-step .ts-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.track-step .ts-n{font-family:var(--font-display);font-weight:700;font-size:12px;color:var(--ink-faint)}
.track-step .ts-status{margin-left:auto;font-size:11px;font-weight:600;color:var(--ink-soft)}
.track-step .ts-ai{font-weight:600;font-size:14px;font-family:var(--font-display)}
.track-step .ts-obj{font-size:12px;color:var(--ink-soft);margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Mobile stepper */
.m-stepper{display:none;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:18px}
.m-stepper .ms-count{font-family:var(--font-display);font-weight:700;font-size:14px}
.m-stepper .ms-bar{flex:1;height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.m-stepper .ms-bar i{display:block;height:100%;background:var(--gold)}

/* ---------- Carte de mission ---------- */
.mission{display:grid;grid-template-columns:1fr 300px;gap:22px}
.mission-main{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px}
.mission-head{display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.mission-head .mh-obj{font-size:21px;font-family:var(--font-display);font-weight:600}
.mission-ai{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin:16px 0}
.field{margin:18px 0}
.field .f-label{font-size:12px;font-weight:700;color:var(--gold-deep);margin-bottom:7px;letter-spacing:.01em}
.field .f-body{font-size:14.5px;color:var(--ink);line-height:1.6}
.field ul{margin:0;padding-left:18px}
.field li{margin:3px 0;font-size:14px;color:var(--ink-soft)}
.prompt-box{position:relative;background:#1B1810;border:1px solid #2A261A;border-radius:12px;
  padding:16px 16px;color:#EDE7D6;font-size:13.5px;line-height:1.6;white-space:pre-wrap;
  font-family:var(--font-body);max-height:280px;overflow:auto}
.prompt-box .copy-btn{position:absolute;top:10px;right:10px}
.mission-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.mission-side{display:flex;flex-direction:column;gap:16px}
.side-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.side-card h4{font-size:13px;color:var(--ink-faint);font-weight:600;margin-bottom:12px}
.status-list{display:flex;flex-direction:column;gap:9px}
.status-row{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-soft)}
.result-input{width:100%;min-height:90px;border:1px solid var(--line-strong);border-radius:10px;padding:12px;
  font-family:inherit;font-size:14px;resize:vertical;color:var(--ink)}
.result-input:focus{outline:none;border-color:var(--gold)}
.mem-item{font-size:13px;color:var(--ink-soft);padding:7px 0;border-bottom:1px solid var(--line)}
.mem-item:last-child{border:none}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(23,21,15,.42);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:40px 18px;overflow:auto}
.modal{background:var(--surface);border-radius:18px;max-width:620px;width:100%;box-shadow:var(--shadow-lg);
  border:1px solid var(--line);overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:18px}
.modal-body{padding:24px;max-height:70vh;overflow:auto}
.modal-x{border:none;background:var(--surface-2);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-soft)}
.modal-x:hover{background:var(--line)}
.relay-block{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.relay-block .rb-k{font-size:11.5px;font-weight:700;color:var(--gold-deep);margin-bottom:5px}
.relay-block .rb-v{font-size:13.5px;color:var(--ink);white-space:pre-wrap}
.relay-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

/* ---------- Explorer / bibliothèque ---------- */
.explore-top{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:10px;padding:9px 14px}
.search input{border:none;outline:none;flex:1;font-family:inherit;font-size:14.5px;background:none;color:var(--ink)}
.filters{display:flex;gap:7px;flex-wrap:wrap}
.filter{font-size:12.5px;border:1px solid var(--line-strong);border-radius:99px;padding:6px 13px;
  background:var(--surface);color:var(--ink-soft);cursor:pointer;transition:all .15s}
.filter.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ai-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.ai-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;
  cursor:pointer;transition:all .15s;display:flex;flex-direction:column}
.ai-card:hover{border-color:var(--gold);box-shadow:var(--shadow);transform:translateY(-2px)}
.ai-card-head{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.ai-card h3{font-size:16px}
.ai-card .ac-cat{font-size:12px;color:var(--ink-faint)}
.ai-card .ac-desc{font-size:13px;color:var(--ink-soft);margin-bottom:12px;flex:1}
.ai-card-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stars{color:var(--gold);font-size:13px;letter-spacing:1px}

/* ---------- Fiche IA ---------- */
.sheet-hero{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.sheet-box{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px}
.sheet-box .sb-k{font-size:11.5px;font-weight:700;color:var(--ink-faint);margin-bottom:6px}
.sheet-box .sb-v{font-size:13.5px;color:var(--ink)}
.pill-list{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;background:var(--gold-tint);border:1px solid #E4D4A6;color:var(--gold-deep);
  padding:3px 10px;border-radius:99px}
.pill.neg{background:#F6EEE9;border-color:#E4CDBE;color:#8A5433}

/* ---------- Comparateur ---------- */
.cmp-table{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp-table th,.cmp-table td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
.cmp-table th{font-family:var(--font-display);font-weight:600;background:var(--surface-2)}
.cmp-table td:first-child{color:var(--ink-soft);font-weight:500}

/* ---------- Projets ---------- */
.proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.proj-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;
  display:flex;flex-direction:column;gap:12px}
.proj-card h3{font-size:17px}

.final-wrap{max-width:640px;margin:0 auto;padding:56px 0;text-align:center}

.final-wrap h2{font-size:34px;margin-bottom:10px}
.recap{text-align:left;margin:28px 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}

.recap-box .rk{font-size:12px;color:var(--ink-faint);font-weight:600}
.recap-box .rv{font-size:20px;font-family:var(--font-display);font-weight:700;margin-top:3px}

.empty{text-align:center;padding:56px 20px;color:var(--ink-soft)}

.learn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.learn-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.learn-card h3{font-size:16px;margin-bottom:7px}
.learn-card p{font-size:13.5px;color:var(--ink-soft)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);

.honesty{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft)}

/* Score de correspondance IA ↔ besoin ↔ profil utilisateur.
   NB : présenté comme "score de correspondance", pas comme une vérité absolue. */
function scoreTool(tool, needType, priorityAxis, owned){
  if(!tool.needs.includes(needType)) return -1;
  let base = (tool.quality + tool.ease + tool.speed) / 3; // 1..5
  let bonus = 0;
  switch(priorityAxis){
    case 'quality': bonus = tool.quality*1.4; break;
    case 'speed': bonus = tool.speed*1.4; break;
    case 'ease': bonus = tool.ease*1.4; break;
    case 'privacy': bonus = tool.privacy*1.6; break;
    case 'free': bonus = (tool.pricing==='free'?5:tool.pricing==='freemium'?3:0)*1.4; break;
    default: bonus = (tool.quality+tool.speed+tool.ease+tool.privacy)/4*1.2; // balance
  }
  // "Ne jamais recommander de changer d'outil sans raison" : bonus si déjà maîtrisé
  if(owned && owned.includes(tool.id)) bonus += 2.2;
  return base*2 + bonus;
}

function recommendForNeed(needType, priorityAxis, owned){
  const scored = AI_TOOLS
    .map(t=>({tool:t, s:scoreTool(t,needType,priorityAxis,owned)}))
    .filter(x=>x.s>=0)
    .sort((a,b)=>b.s-a.s);
  if(!scored.length) return null;
  const best = scored[0];
  const maxS = best.s;
  const pct = Math.min(98, Math.round(72 + (best.s/ (maxS+6))*24)); // score de correspondance lissé
  // Alternatives par axe
  const byAxis = axis => AI_TOOLS.filter(t=>t.needs.includes(needType))
      .sort((a,b)=>scoreTool(b,needType,axis,owned)-scoreTool(a,needType,axis,owned))[0];
  const alts = {
    'Économique': AI_TOOLS.filter(t=>t.needs.includes(needType)).sort((a,b)=>
        (a.pricing==='free'?0:a.pricing==='freemium'?1:2)-(b.pricing==='free'?0:b.pricing==='freemium'?1:2)||b.quality-a.quality)[0],
    'Rapide': byAxis('speed'),
    'Simple': byAxis('ease'),
    'Privé': byAxis('privacy'),
    'Avancé': AI_TOOLS.filter(t=>t.needs.includes(needType)).sort((a,b)=>b.quality-a.quality)[0]
  };
  return { best:best.tool, score:pct, alts };
}

/* Construit le parcours : template + affectation d'IA par étape selon le profil */
function buildWorkflow(templateKey, profile){
  const tpl = WORKFLOW_TEMPLATES[templateKey] || WORKFLOW_TEMPLATES.application;
  const axis = (PRIORITIES.find(p=>p.id===profile.priority)||{}).axis || 'balance';
  return {
    templateKey, label:tpl.label,
    steps: tpl.steps.map((st,i)=>{
      const rec = recommendForNeed(st.need, axis, profile.owned) || {};
      return {
        idx:i, ...st,
        aiId: rec.best ? rec.best.id : null,
        score: rec.score || null,
        alts: rec.alts ? Object.fromEntries(Object.entries(rec.alts).map(([k,v])=>[k, v?v.id:null])) : {},
        status: i===0 ? 'progress' : 'todo',
        result: ''
      };
    })
  };
}

/* Relay Pack "assisté" : rassemble tout ce que l'IA suivante doit recevoir.
   → évite de tout réexpliquer à chaque étape (mémoire de projet incluse). */
function buildRelayPack(project, stepIndex){
  const wf = project.workflow;
  const step = wf.steps[stepIndex];
  const prev = wf.steps.slice(0, stepIndex).filter(s=>s.result);
  const nextAi = tool(step.aiId);
  return {
    goal: project.name,
    stepObjective: step.obj,
    context: `Objectif global : ${project.name}.\nÉtape en cours : ${step.obj} (${stepIndex+1}/${wf.steps.length}).`,
    decisions: project.memory.length ? project.memory.map(d=>'• '+d).join('\n') : '—',
    previousResults: prev.length ? prev.map((s,i)=>`[Étape ${s.idx+1} — ${s.obj}]\n${s.result}`).join('\n\n') : '—',
    prompt: assemblePrompt(project, step),
    expected: step.expected,
    validation: step.validation.map(v=>'• '+v).join('\n'),
    nextAi: nextAi ? nextAi.name : '—'
  };
}

/* ============================ 3bis. CONNECTEUR IA (V2) ============================
   AIProvider.execute() = seul point qui parle à une IA réelle. En V1, il n'existait pas
   (tout était manuel). Ici il appelle une fonction serverless Netlify qui, elle seule,
   détient la clé API (jamais dans le front — cf. règle §61). Si la fonction n'est pas
   déployée / pas de clé → on échoue proprement et l'app reste en mode MANUEL.
   Même schéma que ton ai-router.js de M@Y. */
const AIProvider = {
  connected: false, // passe à true dès qu'un appel réel réussit dans la session
  async execute({need, prompt, context, lang}){
    const res = await fetch('/.netlify/functions/execute', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ need, prompt, context, lang: lang||LANG })
    });
    if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.error||('HTTP '+res.status)); }
    const data = await res.json();
    this.connected = true;
    return data.text || '';
  }
};

/* Exécute réellement l'étape en cours via l'IA connectée, remplit le résultat et le sauvegarde.
   En cas d'échec (mode connecté non configuré) → message clair, on reste en manuel, zéro régression. */
async function runStep(id, i){
  const p = STORE.getProject(id); const step = p.workflow.steps[i];
  const btn = document.getElementById('runBtn');
  if(btn){ btn.disabled=true; btn.dataset.lbl=btn.innerHTML; btn.innerHTML = LANG==='en'?'Running…':'Exécution…'; }
  try{
    const prev = p.workflow.steps.slice(0,i).filter(s=>s.result)
      .map(s=>`[${s.obj}]\n${s.result}`).join('\n\n');
    const ctx = `Objectif global : ${p.name}.\n`
      + (p.memory.length?('Décisions : '+p.memory.join(' ; ')+'.\n'):'')
      + (prev?('Résultats précédents :\n'+prev):'');
    const v = currentPromptValue(); if(v!=null) step.promptEdited=v;
    const finalPrompt = assemblePrompt(p, step, v);
    const text = await AIProvider.execute({ need:step.need, prompt:finalPrompt, context:ctx, lang:LANG });
    step.result = text; if(step.status==='todo') step.status='progress';
    p.updatedAt=Date.now(); STORE.upsertProject(p);
    render(); toast(LANG==='en'?'Result generated by the AI':'Résultat généré par l\u2019IA');
  }catch(err){
    if(btn){ btn.disabled=false; btn.innerHTML=btn.dataset.lbl; }
    openModal(`<div class="modal"><div class="modal-head"><h3>${LANG==='en'?'Connected mode not ready':'Mode connecté non configuré'}</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
      <div class="modal-body"><div class="hb">${ICONS.help} ${LANG==='en'?'The app stays in manual mode — nothing is broken.':'L\u2019app reste en mode manuel — rien n\u2019est cassé.'}</div>
      <p style="color:var(--ink-soft)">${LANG==='en'?'To run steps for real, deploy the serverless function and add your API key on Netlify:':'Pour exécuter les étapes pour de vrai, déploie la fonction serverless et ajoute ta clé API sur Netlify :'}</p>
      <ol style="margin:12px 0 0 18px;color:var(--ink-soft);font-size:14px;line-height:1.8">
        <li>${LANG==='en'?'Add':'Ajoute'} <code>netlify/functions/execute.js</code></li>
        <li>Netlify → Site configuration → Environment variables → <code>ANTHROPIC_API_KEY</code></li>
        <li>${LANG==='en'?'Redeploy, then click « Run with AI » again.':'Redéploie, puis reclique « Exécuter avec l\u2019IA ».'}</li>
      </ol>
      <p style="color:var(--ink-faint);font-size:12.5px;margin-top:12px">Détail : ${esc(err.message)}</p></div></div>`);
  }
}

/* ---------- Cadrage du prompt + format de sortie (mode manuel & connecté) ----------
   Objectif : (1) l'utilisateur écrit son projet DANS le prompt (éditable) ;
   (2) on préfixe un cadrage « nouvelle idée / amélioration / reprise » pour éviter
   qu'une IA reparte sur d'anciennes conversations ; (3) on suffixe une consigne de
   format pour obtenir une réponse structurée, prête à copier-coller vers l'IA suivante. */
const FRAMINGS = {
  new:{ label:'Nouvelle idée',
        hint:'On dira à l\u2019IA de repartir de zéro, sans réutiliser tes conversations précédentes.',
        line:'IMPORTANT : ceci est une NOUVELLE idée, indépendante de toute conversation précédente. N\u2019utilise AUCUN projet ni contexte antérieur ; base-toi uniquement sur ce qui est écrit ci-dessous.' },
  improve:{ label:'J\u2019améliore une idée',
        hint:'On demandera à l\u2019IA d\u2019améliorer une idée existante à partir du contexte fourni.',
        line:'IMPORTANT : je souhaite AMÉLIORER une idée existante. Appuie-toi sur le contexte ci-dessous et propose des améliorations concrètes, sans tout recommencer.' },
  continue:{ label:'Je reprends un travail',
        hint:'On dira à l\u2019IA qu\u2019on poursuit un travail déjà entamé.',
        line:'CONTEXTE : je poursuis un travail déjà entamé. Appuie-toi sur les éléments fournis ci-dessous pour continuer.' }
};
const FORMAT_SUFFIX = 'FORMAT DE SORTIE : réponds de façon structurée, concise et directement exploitable (titres courts, listes à puces). Pas d\u2019introduction ni de conclusion superflue, pas de bavardage : ta réponse sera copiée telle quelle dans une autre IA.';
function assemblePrompt(project, step, edited){
  const f = (FRAMINGS[project.framing||'new']).line;
  const body = (edited!=null && edited!=='') ? edited : (step.promptEdited!=null?step.promptEdited:step.prompt);
  return f + '\n\n' + body + '\n\n' + FORMAT_SUFFIX;
}
function currentPromptValue(){ const el=document.getElementById('promptInput'); return el?el.value:null; }
function setFraming(id,i,f){
  const p=STORE.getProject(id); const v=currentPromptValue(); if(v!=null) p.workflow.steps[i].promptEdited=v;
  p.framing=f; STORE.upsertProject(p); render();
}
function rememberPromptEdit(id,i){
  const p=STORE.getProject(id); const v=currentPromptValue(); if(v!=null){ p.workflow.steps[i].promptEdited=v; STORE.upsertProject(p); }
}
function copyPrompt(id,i){
  const p=STORE.getProject(id); const step=p.workflow.steps[i]; const v=currentPromptValue();
  if(v!=null){ step.promptEdited=v; STORE.upsertProject(p); }
  copy(assemblePrompt(p, step, v), LANG==='en'?'Prompt copied (framing + format included)':'Prompt copié (cadrage + format inclus)');
}

function applyI18n(){
  if(LANG!=='en') return;
  const root=document.getElementById('app'); if(!root) return;
  const walk=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null); const nodes=[]; let n;
  while(n=walk.nextNode()) nodes.push(n);
  nodes.forEach(node=>{
    const raw=node.nodeValue; if(!raw||!raw.trim()) return;
    const lead=raw.match(/^\s*/)[0], trail=raw.match(/\s*$/)[0];
    const norm=raw.trim().replace(/\u00a0/g,' ');
    if(DICT[norm]!==undefined) node.nodeValue = lead + DICT[norm] + trail;
  });
  root.querySelectorAll('[placeholder]').forEach(el=>{
    const k=(el.getAttribute('placeholder')||'').trim().replace(/\u00a0/g,' ');
    if(DICT[k]!==undefined) el.setAttribute('placeholder',DICT[k]);
  });
}

function toast(msg){
  const t=document.getElementById('toast');
  t.innerHTML=ICONS.check+'<span>'+msg+'</span>';
  t.classList.add('show'); clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),1900);
}
function copy(text, msg){ navigator.clipboard?.writeText(text).then(()=>toast(msg||'Copié')).catch(()=>toast('Copie impossible')); }
function openModal(html){

  root.innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()">'+html+'</div>';

function aiLogo(t, size){ const s=size||34; return `<div class="ai-logo" style="width:${s}px;height:${s}px;background:${t.color}">${t.name[0]}</div>`; }
function stars(n){ return '★'.repeat(n)+'<span style="color:var(--line-strong)">'+'★'.repeat(5-n)+'</span>'; }
function pricingBadge(p){ const m={free:['free','Gratuit'],freemium:['freemium','Freemium'],paid:['paid','Payant']}; const [c,l]=m[p]; return `<span class="badge ${c}">${l}</span>`; }

/* ---------- Routeur ---------- */
function go(name, params){ VIEW={name, params:params||{}}; window.scrollTo(0,0); render(); }

function render(){
  app.innerHTML = topbar() + `<main id="main">` + viewHtml() + `</main>` + footer();
  applyI18n();
}
function viewHtml(){
  switch(VIEW.name){
    case 'home': return homeView();

/* ---------- QUESTIONNAIRE (conditionnel, progressif) ---------- */
function quizQuestions(){
  // Questions générées dynamiquement selon les réponses déjà données
  const a=QUIZ.answers;
  const qs=[];
  qs.push({ key:'create', q:'Que veux-tu créer&nbsp;?', help:'On part de ton besoin, pas du nom d\u2019une IA.',
    type:'single', options:['Application','Site web','Image','Vidéo','Présentation','Analyse de données','Recherche','Marketing','Automatisation','Autre'] });
  if(a.create==='Application') qs.push({ key:'appType', q:'Quel type d\u2019application&nbsp;?', type:'single',
    options:['Web / PWA','Mobile','Prototype / MVP','Application complète'] });
  qs.push({ key:'level', q:'Quel est ton niveau avec les IA&nbsp;?', help:'Ça ajuste le niveau d\u2019accompagnement.',
    type:'single', options:['Débutant','Intermédiaire','Avancé','Expert'] });
  qs.push({ key:'priority', q:'Ta priorité principale&nbsp;?', help:'Une IA n\u2019est pas "meilleure" dans l\u2019absolu — mais meilleure pour toi, ici.',
    type:'single', options:PRIORITIES.map(p=>p.label) });
  qs.push({ key:'owned', q:'Utilises-tu déjà certains outils&nbsp;?', help:'Je ne te ferai pas changer d\u2019outil sans raison.',
    type:'multi', options:AI_TOOLS.slice(0,10).map(t=>t.name) });
  return qs;
}
function quizView(){
  const qs=quizQuestions();
  const idx=Math.min(QUIZ.step, qs.length-1);
  const q=qs[idx];
  const pct=Math.round(((idx)/(qs.length))*100);
  const a=QUIZ.answers;
  const sel=a[q.key];
  const optsHtml=q.options.map(o=>{
    const on = q.type==='multi' ? (Array.isArray(sel)&&sel.includes(o)) : sel===o;
    return `<button class="opt ${q.type==='multi'?'multi':''} ${on?'selected':''}" onclick="pickOpt('${q.key}','${escq(o)}','${q.type}')">
      <span class="o-check">${on?ICONS.check:''}</span><span>${o}</span></button>`;
  }).join('');
  const freeBlock = idx===0 ? `<div class="freeform" style="margin-top:18px">
      <div class="field"><div class="f-label">Ou décris ton besoin librement</div>
      <textarea id="freeText" placeholder="Ex : je veux automatiser l\u2019envoi de mes factures…">${esc(a.freeText||'')}</textarea></div></div>` : '';
  return `<div class="container quiz-wrap"><div class="quiz">
    <div class="quiz-progress"><div class="bar" style="width:${pct}%"></div></div>
    <div class="quiz-step-num">Question ${idx+1} sur ${qs.length}</div>
    <h2>${q.q}</h2>${q.help?`<p class="q-help">${q.help}</p>`:''}
    <div class="opts">${optsHtml}</div>
    ${freeBlock}
    <div class="quiz-nav">
      <button class="btn ghost" onclick="quizBack()">${idx===0?'Annuler':'Précédent'}</button>
      <button class="btn ${canNext(q)?'gold':''}" ${canNext(q)?'':'disabled'} onclick="quizNext()">${idx>=qs.length-1?'Voir mon parcours':'Continuer'}</button>
    </div>
  </div></div>`;
}
function canNext(q){ const a=QUIZ.answers; if(q.type==='multi') return true; return !!a[q.key] || (q.key==='create'&&a.freeText); }
function pickOpt(key,val,type){
  val=unescq(val); const a=QUIZ.answers;
  if(type==='multi'){ a[key]=a[key]||[]; const i=a[key].indexOf(val); if(i>=0)a[key].splice(i,1); else a[key].push(val); }
  else a[key]=val;
  render();
}
function quizBack(){ if(QUIZ.step===0){ go('home'); } else { QUIZ.step--; render(); } }
function quizNext(){
  const qs=quizQuestions();
  if(QUIZ.step===0){ const ft=document.getElementById('freeText'); if(ft) QUIZ.answers.freeText=ft.value; }
  if(QUIZ.step>=qs.length-1){ buildFromQuiz(); return; }
  QUIZ.step++; render();
}
function buildFromQuiz(){
  const a=QUIZ.answers;
  const templateKey = GOAL_TO_TEMPLATE[a.create] || 'application';
  const priority = (PRIORITIES.find(p=>p.label===a.priority)||{}).id || 'balance';
  const ownedIds = (a.owned||[]).map(n=>(AI_TOOLS.find(t=>t.name===n)||{}).id).filter(Boolean);
  STORE.data.prefs={ owned:ownedIds, level:a.level||'Débutant' }; STORE.save();
  const wf=buildWorkflow(templateKey, {priority, owned:ownedIds});
  const name = a.freeText ? capitalize(a.freeText.slice(0,60)) : (WORKFLOW_TEMPLATES[templateKey]||{}).label || 'Mon projet';
  QUIZ._draft={ id:uid(), name, templateKey, workflow:wf, memory:[], currentStep:0, status:'draft', priority, createdAt:Date.now(), updatedAt:Date.now() };
  go('plan');
}

/* ---------- PARCOURS RECOMMANDÉ ---------- */

  const p=QUIZ&&QUIZ._draft; if(!p) return emptyState('Aucun parcours','Commence un nouveau projet.',"startNew()","Nouveau projet");

    const t=tool(st.aiId);
    const altChips=Object.entries(st.alts).filter(([k,id])=>id&&id!==st.aiId).slice(0,3)
      .map(([k,id])=>`<span class="alt-chip" onclick="openSheet('${id}')"><span class="k">${k} :</span> ${tool(id).name}</span>`).join('');
    return `<div class="plan-step">
      <div class="plan-idx">${i+1}</div>
      <div class="plan-body">
        <div class="ps-obj">${st.obj}</div>
        <div class="ps-need">${NEED_MAP[st.need].label} · ${badge('','Relais assisté')}</div>
        ${t?`<div class="ai-pick">${aiLogo(t)}<div><div class="ap-name">${t.name}</div><div class="ap-why">${st.why}</div></div>
          <div class="ap-score"><div class="sc">${st.score}%</div><div class="scl">correspondance</div></div></div>`:''}
        ${altChips?`<div class="alts">${altChips}</div>`:''}

  return `<div class="container plan-wrap">
    <div class="plan-head"><h2>Voici ton parcours recommandé</h2>

      <button class="btn ghost" onclick="go('quiz')">${ICONS.back} Ajuster mes réponses</button>

}
function confirmPlan(){ const p=QUIZ._draft; p.status='active'; STORE.upsertProject(p); go('cockpit',{id:p.id}); }

/* ---------- COCKPIT ---------- */
function cockpitView(){
  const p=STORE.getProject(VIEW.params.id);
  if(!p) return emptyState('Projet introuvable','Il a peut-être été supprimé.',"go('projects')","Mes projets");
  const wf=p.workflow; const cur=p.currentStep; const step=wf.steps[cur];
  const done=wf.steps.filter(s=>s.status==='done').length;
  const pct=Math.round((done/wf.steps.length)*100);

  const track=wf.steps.map((st,i)=>{
    const t=tool(st.aiId); const stt=statusLabel(st.status);
    return `<div class="track-step ${i===cur?'current':''} ${i===cur?'m-show':''}" onclick="gotoStep('${p.id}',${i})">
      <div class="ts-top"><span class="dot ${statusDot(st.status)}"></span><span class="ts-n">ÉTAPE ${i+1}</span><span class="ts-status">${stt}</span></div>
      <div class="ts-ai">${t?t.name:'—'}</div>
      <div class="ts-obj">${st.obj}</div></div>`;
  }).join('');

  return `<div class="cockpit"><div class="container">
    <div class="cockpit-top">
      <div><h2>${esc(p.name)}</h2><div class="ct-meta">Objectif atteint à ${pct}% · ${done}/${wf.steps.length} étapes ${badge('manual','V1 · relais assisté')}</div></div>
      <div style="display:flex;gap:8px"><button class="btn sm" onclick="go('projects')">${ICONS.folder} Projets</button>
        <button class="btn sm" onclick="simulate('${p.id}')">Mode simulation</button></div>
    </div>

    <div class="m-stepper"><span class="ms-count">Étape ${cur+1}/${wf.steps.length}</span>
      <span class="ms-bar"><i style="width:${pct}%"></i></span></div>

    <div class="route-track m-list">${track}</div>

    ${missionCard(p, step, cur)}
  </div></div>`;
}
function statusLabel(s){ return ({todo:'À venir',progress:'En cours',wait:'Action requise',done:'Terminée',blocked:'Bloquée'})[s]||s; }
function statusDot(s){ return ({todo:'todo',progress:'progress',wait:'wait',done:'done',blocked:'blocked'})[s]||'todo'; }

/* ---------- Actions cockpit ---------- */
function gotoStep(id,i){ const p=STORE.getProject(id); p.currentStep=i; STORE.upsertProject(p); render(); }
function saveResult(id,i){
  const p=STORE.getProject(id); const v=(document.getElementById('resInput')||{}).value||'';
  p.workflow.steps[i].result=v; if(v && p.workflow.steps[i].status==='todo') p.workflow.steps[i].status='progress';
  p.updatedAt=Date.now(); STORE.upsertProject(p); toast('Résultat enregistré');
}
function addMemory(id){
  const p=STORE.getProject(id); const inp=document.getElementById('memInput'); const v=(inp.value||'').trim();
  if(!v) return; p.memory.push(v); STORE.upsertProject(p); render(); toast('Décision ajoutée à la mémoire');
}
function completeStep(id,i){
  const p=STORE.getProject(id); const v=(document.getElementById('resInput')||{}).value;
  if(v!=null) p.workflow.steps[i].result=v;
  p.workflow.steps[i].status='done';
  const isLast=i===p.workflow.steps.length-1;
  if(isLast){ p.status='done'; p.updatedAt=Date.now(); STORE.upsertProject(p); go('final',{id}); return; }
  p.workflow.steps[i+1].status='progress'; p.currentStep=i+1; p.updatedAt=Date.now();
  STORE.upsertProject(p); toast('Étape validée · relais prêt'); render();
}
function markInsufficient(id,i){
  const p=STORE.getProject(id); p.workflow.steps[i].status='progress';
  STORE.upsertProject(p);
  openModal(`<div class="modal"><div class="modal-head"><h3>Résultat insuffisant</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
   <div class="modal-body"><p style="color:var(--ink-soft);margin-bottom:16px">Que veux-tu faire pour améliorer cette étape&nbsp;?</p>
   <div class="opts">
     <button class="opt" onclick="closeModal();toast('Relance le prompt tel quel')">Recommencer avec le même prompt</button>
     <button class="opt" onclick="closeModal();document.getElementById('resInput')?.focus()">Modifier le prompt / le contexte</button>
     <button class="opt" onclick="closeModal();openReplace('${id}',${i})">Changer d\u2019IA pour cette étape</button>
   </div></div></div>`);
}

  const p=STORE.getProject(id); const pack=buildRelayPack(p,i);

      <p style="color:var(--ink-soft);margin-bottom:16px">Voici le paquet préparé pour l\u2019étape en cours. ${badge('manual','Relais assisté')} — tu copies, tu colles dans l\u2019IA. Rien n\u2019est envoyé automatiquement (ce sera le mode connecté en V2).</p>
      ${relayBlock('Objectif global',pack.goal)}
      ${relayBlock('Décisions déjà prises',pack.decisions)}

      <div class="relay-actions">
        <button class="btn gold" onclick="copy(${jsstr(full)},'Paquet complet copié')">${ICONS.copy} Copier tout</button>
        <button class="btn" onclick="copy(${jsstr(pack.prompt)},'Prompt copié')">Copier le prompt</button>

function relayBlock(k,v){ return `<div class="relay-block"><div class="rb-k">${k}</div><div class="rb-v">${esc(v)}</div></div>`; }
function downloadPack(id,i){
  const p=STORE.getProject(id); const pack=buildRelayPack(p,i);

/* ---------- Remplacer une IA ---------- */
function openReplace(id,i){
  const p=STORE.getProject(id); const step=p.workflow.steps[i];
  const axis=(PRIORITIES.find(x=>x.id===p.priority)||{}).axis||'balance';
  const candidates=AI_TOOLS.filter(t=>t.needs.includes(step.need))
    .map(t=>({t, s:scoreTool(t,step.need,axis,STORE.data.prefs.owned)})).sort((a,b)=>b.s-a.s);
  const rows=candidates.map(({t})=>`<div class="ai-pick" style="margin-bottom:8px">
    ${aiLogo(t)}<div style="flex:1"><div class="ap-name">${t.name} ${t.id===step.aiId?badge('gold','Actuelle'):''}</div>
    <div class="ap-why">${t.specialties.slice(0,2).join(' · ')} · ${pricingBadge(t.pricing)}</div></div>
    ${t.id===step.aiId?'':`<button class="btn sm gold" onclick="doReplace('${id}',${i},'${t.id}')">Choisir</button>`}</div>`).join('');
  openModal(`<div class="modal"><div class="modal-head"><h3>${ICONS.swap} Changer l\u2019IA de cette étape</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body"><p style="color:var(--ink-soft);margin-bottom:16px">Classées selon ta priorité (${(PRIORITIES.find(x=>x.id===p.priority)||{}).label||'compromis'}). Tu peux aussi ouvrir la fiche pour comparer.</p>${rows}</div></div>`);
}
function doReplace(id,i,newId){
  const p=STORE.getProject(id); p.workflow.steps[i].aiId=newId;
  STORE.upsertProject(p); closeModal(); render(); toast('IA remplacée pour cette étape');
}

/* ---------- Simulation (clairement labellisée) ---------- */
function simulate(id){
  openModal(`<div class="modal"><div class="modal-head"><h3>Mode simulation</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
   <div class="modal-body"><div class="hb">${ICONS.help} Démonstration du fonctionnement <b>futur</b> (V2, avec API). Rien n\u2019est réellement exécuté ici.</div>
   <div class="status-list" id="simLog"></div></div></div>`);
  const log=document.getElementById('simLog');
  const lines=['ChatGPT a terminé l\u2019étape 1.','Le relais est prêt.','Claude reçoit le contexte + le résultat.','Claude signale : « il me manque des images ».','L\u2019étape « Visuels » s\u2019active automatiquement.','Résultat transmis à l\u2019étape suivante.'];
  let k=0; const tick=()=>{ if(k>=lines.length)return;
    const row=document.createElement('div'); row.className='status-row';
    row.innerHTML=`<span class="dot done"></span> ${lines[k]}`; log.appendChild(row); k++; setTimeout(tick,650); };
  tick();
}

    ['Construire un workflow','Découpe l\u2019objectif en étapes, affecte une IA par étape, prévois la validation entre chaque.']
  ];
  return `<div class="section"><div class="container">
    <div class="section-head"><h2>Apprendre à utiliser les IA</h2><p>L\u2019essentiel pour naviguer sereinement. Secondaire par rapport au parcours — mais utile.</p></div>
    <div class="learn-grid">${cards.map(([t,d])=>`<div class="learn-card"><h3>${t}</h3><p>${d}</p></div>`).join('')}</div>
  </div></div>`;
}

/* ---------- Empty states & helpers ---------- */
function emptyState(t,d,act,label){ return `<div class="section"><div class="container">${emptyInner(t,d,act,label)}</div></div>`; }
function emptyInner(t,d,act,label){ return `<div class="empty"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">${ICONS.compass.match(/<(circle|polygon)[^>]*>/g).join('')}</svg>
  <h3 style="font-size:19px;color:var(--ink);margin-bottom:6px">${t}</h3><p style="margin-bottom:18px">${d}</p>
  ${act?`<button class="btn gold" onclick="${act}">${label}</button>`:''}</div>`; }

function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escq(s){ return String(s).replace(/'/g,'\\u0027').replace(/"/g,'&quot;'); }
function unescq(s){ return String(s).replace(/\\u0027/g,"'").replace(/&quot;/g,'"'); }
function jsstr(s){ return "'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'')+"'"; }
function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* ---------- Boot ---------- */
render();
</script>
</body>
</html>
